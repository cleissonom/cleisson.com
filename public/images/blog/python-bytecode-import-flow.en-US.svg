<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 735" width="1200" height="735" role="img"><title>The import decision: load a valid .pyc or compile the source</title><style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#111111}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.s{fill:#525252}.b{font-weight:600}.box{fill:#ffffff;stroke:#525252;stroke-width:1.5}.neutral{fill:#f4f3ef;stroke:#cecbc1;stroke-width:1.5}.slow{fill:#fdeee7;stroke:#eb6834;stroke-width:2}.fast{fill:#e8f1fc;stroke:#2a78d6;stroke-width:2}.edge{fill:none;stroke:#525252;stroke-width:2}.eslow{fill:none;stroke:#eb6834;stroke-width:2.5}.efast{fill:none;stroke:#2a78d6;stroke-width:2.5}.grid{stroke:#e7e5df;stroke-width:1}.axis{stroke:#cecbc1;stroke-width:1.5}</style><defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#525252"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><rect width="1200" height="735" fill="#ffffff"/><rect class="box" x="60" y="40" width="240" height="80" rx="8"/><text x="180" y="88" font-size="24" class="m" text-anchor="middle">import foo</text><line class="edge" x1="300" y1="80" x2="347" y2="80" marker-end="url(#ai)"/><rect class="box" x="350" y="40" width="310" height="80" rx="8"/><text x="505" y="87" font-size="20" xml:space="preserve" text-anchor="middle">find <tspan class="m">foo.py</tspan> on <tspan class="m">sys.path</tspan></text><line class="edge" x1="660" y1="80" x2="707" y2="80" marker-end="url(#ai)"/><rect class="box" x="710" y="40" width="430" height="80" rx="8"/><text x="925" y="72" font-size="19" class="s" text-anchor="middle">look for</text><text x="925" y="101" font-size="19" class="m" text-anchor="middle">__pycache__/foo.cpython-315.pyc</text><line class="edge" x1="925" y1="120" x2="925" y2="167" marker-end="url(#ai)"/><path class="box" d="M925,170 L1125,235 L925,300 L725,235 Z"/><text x="925" y="229" font-size="20" text-anchor="middle">valid .pyc for</text><text x="925" y="255" font-size="20" text-anchor="middle">this source?</text><path class="eslow" d="M725,235 H290 V367" marker-end="url(#as)"/><text x="500" y="222" font-size="19" class="s" text-anchor="middle">no</text><rect class="slow" x="60" y="370" width="460" height="110" rx="8"/><text x="290" y="416" font-size="22" class="b" text-anchor="middle">compile the source</text><text x="290" y="450" font-size="19" class="s" text-anchor="middle">tokens → AST → bytecode</text><line class="eslow" x1="290" y1="480" x2="290" y2="537" marker-end="url(#as)"/><rect class="slow" x="60" y="540" width="460" height="110" rx="8"/><text x="290" y="586" font-size="22" xml:space="preserve" text-anchor="middle">try to write the <tspan class="m">.pyc</tspan></text><text x="290" y="620" font-size="19" class="s" text-anchor="middle">never reaches the next pod</text><line class="eslow" x1="520" y1="595" x2="697" y2="595" marker-end="url(#as)"/><line class="efast" x1="925" y1="300" x2="925" y2="367" marker-end="url(#af)"/><text x="945" y="340" font-size="19" class="s">yes</text><rect class="fast" x="700" y="370" width="450" height="110" rx="8"/><text x="925" y="416" font-size="22" xml:space="preserve" class="b" text-anchor="middle">load it with <tspan class="m">marshal.loads</tspan></text><text x="925" y="450" font-size="19" class="s" text-anchor="middle">no parsing, no compiling</text><line class="efast" x1="925" y1="480" x2="925" y2="552" marker-end="url(#af)"/><rect x="700" y="555" width="450" height="80" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2.5"/><text x="925" y="603" font-size="24" class="b" text-anchor="middle">run the module</text><text x="600" y="706" font-size="18" class="s" text-anchor="middle">Both paths end with the same code object.</text></svg>
