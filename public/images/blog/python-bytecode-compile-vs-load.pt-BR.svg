<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 735" width="1200" height="735" role="img"><title>Compilar passa por cinco etapas; carregar pula quatro delas</title><style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#111111}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.s{fill:#525252}.b{font-weight:600}.box{fill:#ffffff;stroke:#525252;stroke-width:1.5}.neutral{fill:#f4f3ef;stroke:#cecbc1;stroke-width:1.5}.slow{fill:#fdeee7;stroke:#eb6834;stroke-width:2}.fast{fill:#e8f1fc;stroke:#2a78d6;stroke-width:2}.edge{fill:none;stroke:#525252;stroke-width:2}.eslow{fill:none;stroke:#eb6834;stroke-width:2.5}.efast{fill:none;stroke:#2a78d6;stroke-width:2.5}.grid{stroke:#e7e5df;stroke-width:1}.axis{stroke:#cecbc1;stroke-width:1.5}</style><defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#525252"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><rect width="1200" height="735" fill="#ffffff"/><text x="40" y="92" font-size="22" class="b">Compilar</text><text x="40" y="118" font-size="17" class="s">sem .pyc válido</text><text x="40" y="232" font-size="22" class="b">Carregar</text><text x="40" y="258" font-size="17" class="s">.pyc válido</text><rect class="slow" x="215" y="60" width="140" height="70" rx="6"/><text x="285" y="101.5" font-size="18" text-anchor="middle">ler .py</text><line class="eslow" x1="356" y1="95" x2="370" y2="95" marker-end="url(#as)"/><rect class="slow" x="373" y="60" width="140" height="70" rx="6"/><text x="443" y="101.5" font-size="18" text-anchor="middle">tokenizar</text><line class="eslow" x1="514" y1="95" x2="528" y2="95" marker-end="url(#as)"/><rect class="slow" x="531" y="60" width="140" height="70" rx="6"/><text x="601" y="101.5" font-size="18" text-anchor="middle">montar a AST</text><line class="eslow" x1="672" y1="95" x2="686" y2="95" marker-end="url(#as)"/><rect class="slow" x="689" y="60" width="140" height="70" rx="6"/><text x="759" y="91" font-size="18" text-anchor="middle">tabela de</text><text x="759" y="113" font-size="18" text-anchor="middle">símbolos</text><line class="eslow" x1="830" y1="95" x2="844" y2="95" marker-end="url(#as)"/><rect class="slow" x="847" y="60" width="140" height="70" rx="6"/><text x="917" y="91" font-size="18" text-anchor="middle">gerar e</text><text x="917" y="113" font-size="18" text-anchor="middle">otimizar</text><line class="eslow" x1="988" y1="95" x2="1002" y2="95" marker-end="url(#as)"/><rect class="box" x="1005" y="60" width="140" height="70" rx="6"/><text x="1075" y="91" font-size="18" text-anchor="middle">objeto de</text><text x="1075" y="113" font-size="18" text-anchor="middle">código</text><rect class="fast" x="215" y="200" width="140" height="70" rx="6"/><text x="285" y="241.5" font-size="18" text-anchor="middle">ler .pyc</text><line class="efast" x1="356" y1="235" x2="370" y2="235" marker-end="url(#af)"/><rect class="fast" x="373" y="200" width="140" height="70" rx="6"/><text x="443" y="241.5" font-size="16" class="m" text-anchor="middle">marshal.loads</text><line class="efast" x1="514" y1="235" x2="1002" y2="235" marker-end="url(#af)"/><text x="758" y="223" font-size="18" class="s" text-anchor="middle">quatro etapas puladas</text><rect class="box" x="1005" y="200" width="140" height="70" rx="6"/><text x="1075" y="231" font-size="18" text-anchor="middle">objeto de</text><text x="1075" y="253" font-size="18" text-anchor="middle">código</text><line class="grid" x1="40" y1="318" x2="1160" y2="318"/><text x="40" y="372" font-size="22" class="b">Importando 107 módulos da biblioteca padrão, 1 CPU</text><text x="250" y="447" font-size="19" text-anchor="end">sem bytecode</text><rect x="816.29" y="418" width="205.71" height="44" fill="#f7c4ad"/><rect x="270" y="418" width="546.29" height="44" fill="#eb6834"/><text x="1036" y="447" font-size="20" class="b">239 a 329 ms</text><text x="250" y="527" font-size="19" text-anchor="end">com bytecode</text><rect x="347.71" y="498" width="11.43" height="44" fill="#a9c9ef"/><rect x="270" y="498" width="77.71" height="44" fill="#2a78d6"/><text x="373.14" y="527" font-size="20" class="b">34 a 39 ms</text><line class="axis" x1="270" y1="572" x2="1070" y2="572"/><line class="axis" x1="270" y1="572" x2="270" y2="578"/><text x="270" y="598" font-size="17" class="s">0 ms</text><line class="axis" x1="498.57" y1="572" x2="498.57" y2="578"/><text x="498.57" y="598" font-size="17" class="s" text-anchor="middle">100 ms</text><line class="axis" x1="727.14" y1="572" x2="727.14" y2="578"/><text x="727.14" y="598" font-size="17" class="s" text-anchor="middle">200 ms</text><line class="axis" x1="955.71" y1="572" x2="955.71" y2="578"/><text x="955.71" y="598" font-size="17" class="s" text-anchor="middle">300 ms</text><text x="40" y="656" font-size="19">Pico de memória: 29,8 MiB sem bytecode, 24,2 MiB com ele.</text><text x="40" y="690" font-size="17" class="s">Quatro execuções, cada uma a mediana de sete inícios, na imagem python:3.15.2-slim original.</text></svg>
