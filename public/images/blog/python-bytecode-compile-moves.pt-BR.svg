<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 735" width="1200" height="735" role="img"><title>Antes e depois: onde a compilação acontece</title><style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#111111}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.s{fill:#525252}.b{font-weight:600}.box{fill:#ffffff;stroke:#525252;stroke-width:1.5}.neutral{fill:#f4f3ef;stroke:#cecbc1;stroke-width:1.5}.slow{fill:#fdeee7;stroke:#eb6834;stroke-width:2}.fast{fill:#e8f1fc;stroke:#2a78d6;stroke-width:2}.edge{fill:none;stroke:#525252;stroke-width:2}.eslow{fill:none;stroke:#eb6834;stroke-width:2.5}.efast{fill:none;stroke:#2a78d6;stroke-width:2.5}.grid{stroke:#e7e5df;stroke-width:1}.axis{stroke:#cecbc1;stroke-width:1.5}</style><defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#525252"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><rect width="1200" height="735" fill="#ffffff"/><text x="40" y="38" font-size="20"><tspan class="b">ANTES</tspan><tspan class="s" dx="14">a imagem leva só arquivos .py</tspan></text><text x="250" y="88" font-size="19" class="s" text-anchor="end">Build da imagem</text><rect class="neutral" x="270" y="58" width="300" height="46" rx="6"/><text x="420" y="87.5" font-size="19" text-anchor="middle">Instalar dependências</text><line class="edge" x1="572" y1="81" x2="589" y2="81" marker-end="url(#ai)"/><rect class="neutral" x="592" y="58" width="200" height="46" rx="6"/><text x="692" y="87.5" font-size="19" text-anchor="middle">Copiar o código</text><line class="grid" x1="490" y1="120" x2="490" y2="272"/><line class="grid" x1="710" y1="120" x2="710" y2="272"/><line class="grid" x1="930" y1="120" x2="930" y2="272"/><line class="grid" x1="1150" y1="120" x2="1150" y2="272"/><text x="250" y="152.5" font-size="19" class="s" text-anchor="end">Pod (deploy)</text><rect class="slow" x="270" y="128" width="552.4" height="36" rx="5"/><text x="286" y="152.5" font-size="19">compilando ~760 módulos</text><rect class="neutral" x="826.4" y="128" width="235.6" height="36" rx="5"/><text x="838.4" y="152.5" font-size="17">resto da inicialização</text><line x1="1062" y1="122" x2="1062" y2="170" stroke="#111111" stroke-width="2.5"/><text x="1074" y="153" font-size="20" class="b">1,80 s</text><text x="250" y="200.5" font-size="19" class="s" text-anchor="end">Pod (escala)</text><rect class="slow" x="270" y="176" width="552.4" height="36" rx="5"/><text x="286" y="200.5" font-size="19">compilando ~760 módulos</text><rect class="neutral" x="826.4" y="176" width="235.6" height="36" rx="5"/><text x="838.4" y="200.5" font-size="17">resto da inicialização</text><line x1="1062" y1="170" x2="1062" y2="218" stroke="#111111" stroke-width="2.5"/><text x="250" y="248.5" font-size="19" class="s" text-anchor="end">Pod (novo nó)</text><rect class="slow" x="270" y="224" width="552.4" height="36" rx="5"/><text x="286" y="248.5" font-size="19">compilando ~760 módulos</text><rect class="neutral" x="826.4" y="224" width="235.6" height="36" rx="5"/><text x="838.4" y="248.5" font-size="17">resto da inicialização</text><line x1="1062" y1="218" x2="1062" y2="266" stroke="#111111" stroke-width="2.5"/><line class="axis" x1="270" y1="276" x2="1150" y2="276"/><line class="axis" x1="270" y1="276" x2="270" y2="282"/><text x="270" y="302" font-size="17" class="s">0 s</text><line class="axis" x1="490" y1="276" x2="490" y2="282"/><text x="490" y="302" font-size="17" class="s" text-anchor="middle">0,5 s</text><line class="axis" x1="710" y1="276" x2="710" y2="282"/><text x="710" y="302" font-size="17" class="s" text-anchor="middle">1 s</text><line class="axis" x1="930" y1="276" x2="930" y2="282"/><text x="930" y="302" font-size="17" class="s" text-anchor="middle">1,5 s</text><line class="axis" x1="1150" y1="276" x2="1150" y2="282"/><text x="1150" y="302" font-size="17" class="s" text-anchor="end">2 s</text><text x="270" y="336" font-size="18" class="s">Cada pod novo compila de novo, e o resultado nunca chega ao próximo pod.</text><line class="grid" x1="40" y1="364" x2="1160" y2="364"/><text x="40" y="406" font-size="20"><tspan class="b">AGORA</tspan><tspan class="s" dx="14">a imagem leva arquivos .py e .pyc</tspan></text><text x="250" y="456" font-size="19" class="s" text-anchor="end">Build da imagem</text><rect class="slow" x="270" y="426" width="360" height="46" rx="6"/><text x="450" y="455.5" font-size="19" text-anchor="middle">Instalar + compilar dependências</text><line class="edge" x1="632" y1="449" x2="649" y2="449" marker-end="url(#ai)"/><rect class="neutral" x="652" y="426" width="184" height="46" rx="6"/><text x="744" y="455.5" font-size="19" text-anchor="middle">Copiar o código</text><line class="edge" x1="838" y1="449" x2="855" y2="449" marker-end="url(#ai)"/><rect class="slow" x="858" y="426" width="292" height="46" rx="6"/><text x="1004" y="455.5" font-size="19" text-anchor="middle">Compilar código + stdlib</text><line class="grid" x1="490" y1="488" x2="490" y2="640"/><line class="grid" x1="710" y1="488" x2="710" y2="640"/><line class="grid" x1="930" y1="488" x2="930" y2="640"/><line class="grid" x1="1150" y1="488" x2="1150" y2="640"/><text x="250" y="520.5" font-size="19" class="s" text-anchor="end">Pod (deploy)</text><rect class="fast" x="270" y="496" width="237.6" height="36" rx="5"/><text x="284" y="520.5" font-size="19">inicia, carrega .pyc</text><line x1="507.6" y1="490" x2="507.6" y2="538" stroke="#111111" stroke-width="2.5"/><text x="519.6" y="521" font-size="20" class="b">0,54 s</text><text x="250" y="568.5" font-size="19" class="s" text-anchor="end">Pod (escala)</text><rect class="fast" x="270" y="544" width="237.6" height="36" rx="5"/><text x="284" y="568.5" font-size="19">inicia, carrega .pyc</text><line x1="507.6" y1="538" x2="507.6" y2="586" stroke="#111111" stroke-width="2.5"/><text x="250" y="616.5" font-size="19" class="s" text-anchor="end">Pod (novo nó)</text><rect class="fast" x="270" y="592" width="237.6" height="36" rx="5"/><text x="284" y="616.5" font-size="19">inicia, carrega .pyc</text><line x1="507.6" y1="586" x2="507.6" y2="634" stroke="#111111" stroke-width="2.5"/><line class="axis" x1="270" y1="644" x2="1150" y2="644"/><line class="axis" x1="270" y1="644" x2="270" y2="650"/><text x="270" y="670" font-size="17" class="s">0 s</text><line class="axis" x1="490" y1="644" x2="490" y2="650"/><text x="490" y="670" font-size="17" class="s" text-anchor="middle">0,5 s</text><line class="axis" x1="710" y1="644" x2="710" y2="650"/><text x="710" y="670" font-size="17" class="s" text-anchor="middle">1 s</text><line class="axis" x1="930" y1="644" x2="930" y2="650"/><text x="930" y="670" font-size="17" class="s" text-anchor="middle">1,5 s</text><line class="axis" x1="1150" y1="644" x2="1150" y2="650"/><text x="1150" y="670" font-size="17" class="s" text-anchor="end">2 s</text><text x="270" y="704" font-size="18" class="s">O build compila uma vez. Cada pod carrega o resultado.</text></svg>
